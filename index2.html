<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        display: flex;
        justify-content:center ;
        align-items: center;
        height: 100vh;
    }
    .main{
        height: 200px;width: 200px;background-color: rgb(0, 0, 0); transition: 1s;
    }
    main:hover{
           transform: rotate(-145deg);
         transform: scaleX(2);
        transform: scaleY(2);
        transform: skew(-20deg);
        transform: skewY(-20deg);
         transform: translateX(-100px);
        transform: translateY(-100px);
    }

          
</style>
<body>
    <div class="main"></div>
    <br>
    <div class="box"></div>
    <div class="a1"></div> 
    <div class="a2"></div>
    <div class="a3"></div>
</body>
</html>
